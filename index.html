<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>John Digit Pro</title><style>*{box-sizing:border-box}body{margin:0;background:#080c18;color:#fff;font-family:system-ui;padding:8px}.h{color:#00ff88;text-align:center;font-size:16px;margin:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-width:1200px;margin:10px auto}.card{background:#121a2e;border:1px solid #1e2a4a;border-radius:12px;padding:10px}.price{font-size:20px;font-weight:900}.badge{font-size:11px;background:#1c2746;padding:2px 6px;border-radius:8px}.stat{font-size:10px;display:flex;justify-content:space-between;background:#0e1426;padding:3px 6px;border-radius:6px;margin:2px 0}.hot{color:#00ff88;font-weight:800}.pred{padding:6px;border-radius:8px;margin-top:4px;font-size:11px;font-weight:700;text-align:center;border:1px solid}.buy{border-color:#00ff88;color:#00ff88;background:#00ff8815}.sell{border-color:#ff4455;color:#ff8a8a;background:#ff445515}.log{max-width:1200px;margin:10px auto;background:#050810;border:1px solid #1e2a4a;border-radius:10px;padding:8px;height:100px;overflow:auto;font-family:monospace;font-size:10px}.btn{padding:6px 10px;border-radius:8px;border:0;background:#00ff88;color:#000;font-weight:800}</style></head><body><h1 class="h">JOHN DIGIT PRO - MATCHES/DIFFERS/EVEN/ODD/OVER/UNDER/RISE/FALL</h1><div style="text-align:center"><button class="btn" onclick="location.reload()">RECONNECT</button> <select id="rng" style="background:#121a2e;color:#fff;padding:6px;border-radius:8px"><option value="100">100 ticks</option><option value="500" selected>500 ticks</option><option value="1000">1000 ticks</option></select> <span id="stat" style="font-size:11px;margin-left:8px">Connecting...</span></div><div class="grid" id="g"></div><div class="log" id="lg"></div><script>const S=["R_10","R_25","R_50","R_75","R_100","BOOM1000","BOOM500","CRASH1000","CRASH500","VOL10","VOL25","VOL50","VOL75","VOL100","1HZ10V","1HZ100V","1HZ25V","1HZ50V","1HZ75V","1HZ10V-S","1HZ100V-S","VOL10S","VOL25S","VOL50S","VOL75S","VOL100S","R_10S","R_25S","R_50S","R_75S","R_100S"];let H={},P={},ws,idx=0;const EPS=["wss://ws.derivws.com/websockets/v3?app_id=36300","wss://ws.derivws.com/websockets/v3?app_id=1089","wss://ws.binaryws.com/websockets/v3?app_id=1089","wss://ws.deriv.com/websockets/v3?app_id=1089"];function lg(m){let e=document.getElementById('lg');e.innerHTML=new Date().toLocaleTimeString()+' '+m+'<br>'+e.innerHTML.slice(0,3000)}function dig(p){let s=p.toString().split('.');return s[1]?parseInt(s[1].slice(-1)):0}function calc(s){let h=H[s];if(!h||h.length<20)return null;let R=parseInt(document.getElementById('rng').value);let arr=h.slice(-R);let c=[0,0,0,0,0,0];arr.forEach(v=>c[dig(v)]++);let tot=arr.length;let even=arr.filter(v=>dig(v)%2==0).length;let over=arr.filter(v=>dig(v)>4).length;let up=0,dn=0;for(let i=1;i<h.length;i++){if(h[i]>h[i-1])up++;else if(h[i]<h[i-1])dn++}let max=Math.max(...c),min=Math.min(...c);return{c,even,over,up,dn,hot:c.indexOf(max),cold:c.indexOf(min),last:dig(arr[arr.length-1]),tot,max,min}}function render(){let g=document.getElementById('g');let out='';S.forEach(s=>{let a=calc(s);let pr=P[s]?P[s].toFixed(3):'--';let ticks=H[s]?H[s].length:0;if(!a){out+=`<div class="card"><b>${s}</b> <span class="badge">${ticks} ticks</span><div class="price">${pr}</div></div>`;return}let evenP=(a.even/a.tot*100).toFixed(0),overP=(a.over/a.tot*100).toFixed(0),upP=a.up+a.dn>0?(a.up/(a.up+a.dn)*100).toFixed(0):50;out+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${s}</b><span class="badge">#${a.last} ${ticks}t</span></div><div class="price">${pr}</div><div style="display:flex;gap:2px;margin:4px 0">${a.c.map((v,i)=>`<div style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;background:${i==a.hot?'#00ff88':i==a.cold?'#ff4455':'#1c2746'};color:${i==a.hot?'#000':'#fff'}">${i}</div>`).join('')}</div><div class="stat"><span>EVEN ${evenP}%</span><span>ODD ${100-evenP}%</span></div><div class="stat"><span>OVER ${overP}%</span><span>UNDER ${100-overP}%</span></div><div class="stat"><span>RISE ${upP}%</span><span>FALL ${100-upP}%</span></div><div class="pred ${a.max/a.tot>0.18?'buy':''}" style="border-style:${a.max/a.tot>0.18?'solid':'dashed'}">MATCHES: ${a.hot} (${(a.max/a.tot*100).toFixed(1)}%) - Most frequent</div><div class="pred sell">DIFFERS: ${a.cold} (${(a.min/a.tot*100).toFixed(1)}%) - Least frequent</div><div class="pred ${evenP>55?'buy':evenP<45?'sell':''}">${evenP>55?'EVEN':evenP<45?'ODD':'WAIT'} ${Math.max(evenP,100-evenP)}%</div><div class="pred ${overP>55?'buy':overP<45?'sell':''}">${overP>55?'OVER 4':overP<45?'UNDER 5':'WAIT'} ${Math.max(overP,100-overP)}%</div><div class="pred ${upP>58?'buy':upP<42?'sell':''}">${upP>58?'RISE / ONLY UP':upP<42?'FALL / ONLY DOWN':'CHOPPY WAIT'} ${Math.max(upP,100-upP)}%</div></div>`});g.innerHTML=out;document.getElementById('stat').innerText=Object.keys(H).length+' markets | '+Object.values(H).reduce((a,b)=>a+b.length,0)+' ticks'}function connect(){let url=EPS[idx%EPS.length];lg('Trying '+url);document.getElementById('stat').innerText='Connecting '+url.slice(0,35)+'...';try{ws=new WebSocket(url);ws.onopen=()=>{lg('CONNECTED!');document.getElementById('stat').innerText='Connected - subscribing';S.forEach(s=>ws.send(JSON.stringify({ticks:s,subscribe:1})))};ws.onmessage=m=>{try{let d=JSON.parse(m.data);if(d.tick){let sym=d.echo_req.ticks;let q=parseFloat(d.tick.quote);P[sym]=q;if(!H[sym])H[sym]=[];H[sym].push(q);if(H[sym].length>1000)H[sym].shift();render()}}catch(e){}};ws.onerror=()=>{lg('Error on '+url);idx++;setTimeout(connect,1500)};ws.onclose=()=>{lg('Closed - switching endpoint');idx++;setTimeout(connect,1500)}}catch(e){lg('Fail '+e);idx++;setTimeout(connect,1500)}}connect();setInterval(render,2000)</script></body></html>
